<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐会研习与曲目赏析文库 | Concert Repertoire Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-parchment-50 text-parchment-900 dark:bg-obsidian-950 dark:text-[#EAECEF] font-sans antialiased transition-colors duration-200 min-h-screen flex flex-col justify-between">

  <!-- 顶部全局导航栏 -->
  <header class="sticky top-0 z-40 bg-parchment-50/95 dark:bg-obsidian-900/95 backdrop-blur-md border-b border-parchment-200 dark:border-obsidian-800">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-accentGold-500"></span>
        <div>
          <span class="block text-xs sm:text-sm font-serif font-bold text-parchment-900 dark:text-zinc-100 tracking-tight">
            音乐会研习档案
          </span>
          <span class="block text-[9px] font-mono tracking-widest uppercase text-accentGold-700 dark:text-accentGold-400">
            Concert Repertoire Archive
          </span>
        </div>
      </div>

      <div class="flex items-center space-x-1.5 sm:space-x-2">
        <!-- 字号调节按钮 -->
        <button id="fontSizeBtn" onclick="cycleFontSize()" title="切换字号大小 (标准 / 放大 / 特大)" class="px-2.5 py-1.5 text-xs rounded-lg border border-parchment-300 dark:border-zinc-700 bg-parchment-100 dark:bg-obsidian-800 text-parchment-800 dark:text-zinc-200 hover:text-accentGold-600 dark:hover:text-accentGold-400 flex items-center gap-1 transition-all active:scale-95">
          <span class="font-serif font-bold text-xs tracking-tighter">Aa</span>
          <span class="text-[10px] font-sans font-medium" id="fontSizeLabel">标准</span>
        </button>

        <!-- 日夜主题切换 -->
        <button onclick="toggleDarkMode()" title="切换日夜模式" class="p-1.5 rounded-lg border border-parchment-300 dark:border-zinc-700 bg-parchment-100 dark:bg-obsidian-800 text-parchment-800 dark:text-zinc-200 hover:text-accentGold-500 transition-colors">
          <svg id="themeIconSun" class="w-4 h-4 hidden dark:block text-accentGold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9h-1m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg id="themeIconMoon" class="w-4 h-4 block dark:hidden text-parchment-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 首页主体 -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 pt-6 pb-12 w-full flex-1">
    
    <!-- 头部横幅与说明 -->
    <section class="mb-8 rounded-2xl p-5 sm:p-7 bg-white dark:bg-obsidian-900 border border-parchment-200 dark:border-obsidian-800 card-shadow transition-all">
      <div class="max-w-2xl">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-accentGold-500/15 text-accentGold-700 dark:text-accentGold-400 uppercase tracking-wider mb-2">
          学术级演出排练档案与曲目导赏
        </span>
        <h1 class="text-2xl sm:text-3xl font-serif font-bold text-parchment-900 dark:text-zinc-100 tracking-tight leading-snug">
          音乐会研习与曲目赏析文库
        </h1>
        <p class="font-serif text-xs sm:text-sm text-parchment-600 dark:text-zinc-400 mt-2 leading-relaxed">
          收录近期重点关注的现场音乐会排练与演奏档案。点击任意音乐会卡片，即可进入对应的学术研习指南正文，浏览曲式结构拆解、现场 30 秒听觉锚点与乐章现场实况录音。
        </p>
      </div>

      <!-- 快速筛选分类 -->
      <div class="flex flex-wrap items-center gap-2 mt-5 pt-4 border-t border-parchment-100 dark:border-obsidian-800/80">
        <button id="filterAll" data-filter="all" onclick="setFilter('all')" class="px-3.5 py-1.5 rounded-lg text-xs font-serif font-bold bg-accentGold-500/20 text-accentGold-700 dark:text-accentGold-300 border border-accentGold-500/50 shadow-sm transition-all">
          全部演出
        </button>
        <button id="filterUpcoming" data-filter="upcoming" onclick="setFilter('upcoming')" class="px-3.5 py-1.5 rounded-lg text-xs font-serif text-parchment-600 dark:text-zinc-400 hover:bg-parchment-200/60 dark:hover:bg-obsidian-800 border border-transparent transition-all">
          待演音乐会
        </button>
        <button id="filterPast" data-filter="past" onclick="setFilter('past')" class="px-3.5 py-1.5 rounded-lg text-xs font-serif text-parchment-600 dark:text-zinc-400 hover:bg-parchment-200/60 dark:hover:bg-obsidian-800 border border-transparent transition-all">
          历史演出
        </button>
      </div>
    </section>

    <!-- 动态音乐会列表容器 (按待演正序与历史倒序两大模块呈现) -->
    <div id="homeContent">
      <div class="py-16 text-center text-parchment-500 dark:text-zinc-400 font-serif">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-accentGold-500 border-t-transparent mb-3"></div>
        <p class="text-sm">正在载入音乐会档案文库...</p>
      </div>
    </div>

  </main>

  <!-- 底部版权信息 -->
  <footer class="bg-parchment-100/80 dark:bg-obsidian-900/90 border-t border-parchment-200 dark:border-obsidian-800 py-4 px-4 text-center">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-parchment-600 dark:text-zinc-400 font-serif">
      <p>古典音乐会研习与曲目赏析文库 · 纯静态数据解耦架构</p>
      <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="text-accentGold-700 dark:text-accentGold-400 hover:underline text-[11px] font-sans font-medium">
        ↑ 返回顶部
      </button>
    </div>
  </footer>

  <script src="data/concerts-bundle.js?v=20261111_auto_archive"></script>
  <script src="js/home.js?v=20261111_auto_archive"></script>
</body>
</html>
